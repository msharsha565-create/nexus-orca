<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NexusOrca</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0e1116;--fg:#d6dde6;--card:#161b22;--bd:#2b3340;--add:#1f6f43;--del:#8a2d2d;--ac:#4aa3ff}
@media(prefers-color-scheme:light){:root{--bg:#fff;--fg:#1c2128;--card:#f4f6f8;--bd:#d0d7de;--add:#cdf2d9;--del:#fcd5d5}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui}
header{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
input,button{padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg)}
input{flex:1;min-width:200px}button{cursor:pointer}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.card h3{margin:0;padding:8px 12px;border-bottom:1px solid var(--bd);font-size:13px;display:flex;justify-content:space-between}
pre{margin:0;padding:8px 12px;height:200px;overflow:auto;font:12px ui-monospace,monospace;white-space:pre-wrap}
.diff div{cursor:pointer}.diff .a{background:var(--add)}.diff .d{background:var(--del)}
.actions{padding:8px;display:flex;gap:6px;border-top:1px solid var(--bd)}
#status{margin-left:auto;align-self:center;opacity:.7}
</style></head><body>
<header>
  <input id="prompt" placeholder="Prompt to fan out to all agents">
  <input id="agents" value="claude-code,codex,opencode" style="max-width:260px">
  <button id="go">Fan out</button><span id="status">connecting…</span>
</header>
<div id="grid"></div>
<script>
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';
const ws=new WebSocket('ws://127.0.0.1:7420/?token='+encodeURIComponent(token)),$=s=>document.querySelector(s);
const pending=new Map();let seq=0;const cards={};
const rpc=(method,params)=>new Promise((res,rej)=>{const id=++seq;pending.set(id,{res,rej});ws.send(JSON.stringify({id,method,params}))});
ws.onopen=()=>{$('#status').textContent='connected';rpc('list').then(l=>l.forEach(card))};
ws.onclose=()=>$('#status').textContent='disconnected';
ws.onmessage=({data})=>{const m=JSON.parse(data);
  if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.rej(new Error(m.error)):p.res(m.result);return}
  if(m.event==='data')card(m.worktree).term.textContent+=m.chunk;
  if(m.event==='exit')card(m.worktree).title.textContent=`${m.worktree.branch} · exit ${m.code}`;};
function card(wt){if(cards[wt.branch])return cards[wt.branch];
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`<h3><span></span></h3><pre class="term"></pre><pre class="diff" hidden></pre>
  <div class="actions"><button data-a=diff>Diff</button><button data-a=merge>Merge winner</button></div>`;
  const c={term:el.querySelector('.term'),diff:el.querySelector('.diff'),title:el.querySelector('h3 span')};
  c.title.textContent=wt.branch;cards[wt.branch]=c;$('#grid').append(el);
  el.onclick=async e=>{const a=e.target.dataset?.a;if(!a)return;
    if(a==='diff'){const d=await rpc('diff',{branch:wt.branch});c.diff.hidden=false;c.term.hidden=true;
      c.diff.replaceChildren(...d.split('\n').map(l=>{const x=document.createElement('div');x.textContent=l;
        x.className=l[0]==='+'?'a':l[0]==='-'?'d':'';
        x.title='Click to send as review comment';
        x.onclick=()=>{const t=prompt('Comment on: '+l);if(t)rpc('steer',{branch:wt.branch,text:`Review comment on "${l}": ${t}`})};return x}))}
    if(a==='merge'){await rpc('merge',{branch:wt.branch});alert('Merged '+wt.branch)}};
  return c}
$('#go').onclick=()=>rpc('fanout',{agents:$('#agents').value.split(','),prompt:$('#prompt').value}).then(l=>l.forEach(card)).catch(e=>alert(e.message));
</script></body></html>
